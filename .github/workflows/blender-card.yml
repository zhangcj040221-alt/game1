name: Build Blender 3D Card
on:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-card.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blender-card-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libopengl0
          blender --version
      - name: Render and export GLB
        run: |
          mkdir -p assets
          blender -b -t 4 --python blender/chef_bu.py
          test -s assets/chef_bu.glb
          test -s assets/chef_bu_preview.png
      - name: Commit exported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chef_bu.glb assets/chef_bu_preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Render Chef Bu Blender assets [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
