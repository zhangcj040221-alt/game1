name: Layered Card Browser Checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'card.css'
      - 'viewer.js'
      - 'assets/layers/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/card-preview.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'card.css'
      - 'viewer.js'
      - 'assets/layers/**'
      - 'tests/**'
      - 'package*.json'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layered-card-screenshots
          path: test-results/layered-*.png
