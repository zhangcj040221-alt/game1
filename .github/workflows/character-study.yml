name: Legacy Character Study (Manual Archive)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libopengl0
      - name: Generate legacy assets
        run: blender -b -t 4 --python blender/character_study.py
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-blender-assets
          path: assets/character_test/
