name: Build and verify card prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:geometry
      - run: npm run build
      - run: google-chrome --version
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-browser-verification
          path: test-results/
