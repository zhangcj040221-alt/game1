<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口袋大奖赛 · 卡框对照</title><link rel="stylesheet" href="./src/frames.css"></head>
<body><main><header class="heading"><h1>卡框对照</h1><div class="switch" aria-label="选择卡框"><button id="a" aria-pressed="true">A 薄边</button><button id="b" aria-pressed="false">B 厚边</button></div></header>
<div class="pair">
<figure class="first"><figcaption>A · 薄边画窗</figcaption><article class="card thin"><div class="rim"></div><div class="lip"></div><div class="brand">一二布布<span>海湾赛道 · 陆</span></div><div class="stage" id="stage" aria-label="拖动转动视角"></div><div class="base"><h2>口袋大奖赛</h2></div></article></figure>
<figure class="second"><figcaption>B · 软陶厚框</figcaption><article class="card thick"><div class="rim"></div><div class="lip"></div><div class="brand">一二布布<span>海湾赛道 · 陆</span></div><div class="stage"><canvas id="mirror"></canvas></div><div class="base"><h2>口袋大奖赛</h2></div></article></figure></div>
<p id="line"></p><footer><button id="play">播放</button><label>动作进度<input id="time" type="range" min="0" max="1000"></label><label>视角<input id="angle" type="range" min="-20" max="20" value="0"></label></footer></main>
<script type="module" src="./src/frames.js"></script></body></html>
