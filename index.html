<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>厨师布 · 互动立体卡</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 40%,#493025,#11121d 75%);color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}.wrap{max-width:540px;margin:auto;padding:22px 16px;text-align:center}h1{font-size:21px;margin:4px 0 6px}.hint{color:#c7b8a5;font-size:13px;margin:0 0 18px}.scene{height:min(68vh,640px);min-height:440px;display:grid;place-items:center;perspective:950px;touch-action:none;user-select:none}.card{width:min(76vw,335px);height:min(112vw,485px);max-height:520px;position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .16s ease-out;filter:drop-shadow(0 30px 24px #0009);border-radius:26px;isolation:isolate}.plate{position:absolute;inset:0;border-radius:26px;background:linear-gradient(145deg,#fff0c4,#bb681c 12%,#ffe39c 22%,#8a451a 42%,#fff1ba 68%,#a4561a 90%);box-shadow:inset 0 0 0 5px #ffe5a1,inset 0 0 0 10px #8e4c1e,0 0 28px #ffb74465;transform:translateZ(0)}.inner{position:absolute;inset:13px;border-radius:19px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#ffe1a2,#bb7746 45%,#55382f 100%);border:3px solid #ffdea0;transform:translateZ(10px)}.window{position:absolute;inset:0;background:linear-gradient(90deg,transparent 18%,#fff8 19%,transparent 20%,transparent 79%,#fff8 80%,transparent 81%),linear-gradient(0deg,transparent 36%,#fff6 37%,transparent 38%,transparent 69%,#fff6 70%,transparent 71%);opacity:.5}.shelf{position:absolute;left:0;right:0;top:23%;height:10px;background:#78432c;box-shadow:0 6px 8px #0005}.shelf:before{content:'🫙  🍶  🥫';position:absolute;bottom:9px;left:13px;font-size:24px}.counter{position:absolute;bottom:0;left:0;right:0;height:23%;background:linear-gradient(#b77a49,#65402f);border-top:13px solid #e3aa72}.ambient{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 10%,#4b241e77 100%)}.chef{position:absolute;width:91%;left:4.5%;top:14%;transform:translateZ(78px) translate(var(--px,0px),var(--py,0px));filter:drop-shadow(0 12px 9px #4b291d88);pointer-events:none}.food{position:absolute;right:0;top:35%;font-size:32px;transform:translateZ(118px) translate(calc(var(--px,0px)*1.5),calc(var(--py,0px)*1.5));animation:bob 2.5s ease-in-out infinite}.spark{position:absolute;color:#fff0a3;text-shadow:0 0 12px orange;transform:translateZ(130px);animation:twinkle 1.8s ease-in-out infinite alternate}.s1{top:19%;left:12%}.s2{top:33%;right:13%;animation-delay:.5s}.s3{bottom:29%;left:8%;animation-delay:1s}.banner{position:absolute;bottom:10%;left:-4%;right:-4%;padding:12px 0 16px;border-radius:45% 45% 28% 28%;background:linear-gradient(#fff2b9,#eab45e 40%,#a55d24);border:4px ridge #ffe9a0;color:#713817;font-size:31px;font-weight:1000;letter-spacing:4px;text-shadow:0 1px #fff5;transform:translateZ(105px);box-shadow:0 10px 10px #4c260d88}.stars{position:absolute;bottom:2%;left:0;right:0;color:#ffe66d;font-size:24px;text-shadow:0 0 12px #ffc43c;transform:translateZ(75px)}.crest{position:absolute;top:-17px;left:50%;transform:translateX(-50%) translateZ(125px);width:80px;height:69px;display:grid;place-items:center;background:linear-gradient(#fff1b2,#d9922c);border:5px ridge #ffdf8d;border-radius:50%;font-size:39px;box-shadow:0 0 22px #ffba59}.shine{position:absolute;inset:0;border-radius:25px;background:linear-gradient(110deg,transparent 27%,#ffffff55 45%,transparent 58%);mix-blend-mode:screen;transform:translateZ(145px) translateX(var(--shine,-50%));pointer-events:none}.glow{position:absolute;inset:-5px;border:2px solid #ffeaa8;border-radius:29px;box-shadow:0 0 32px #ffbc5c,0 0 65px #ffad3244;pointer-events:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.controls button{border:1px solid #b98549;background:#3b2b29;color:#ffe1aa;border-radius:20px;padding:10px 13px;font-size:13px}.controls button.active{background:#b16c26;color:white;box-shadow:0 0 15px #d99a48}.info{font-size:12px;color:#cbb49c;margin:14px auto;max-width:340px}.card.low .spark,.card.low .food,.card.low .glow{display:none}.card.low .chef{transform:translateZ(8px)}.card.mid .spark,.card.mid .glow{display:none}.burst .card{animation:upgrade 1.3s ease-out}.burst .glow{box-shadow:0 0 65px #fff1a0,0 0 130px #ffc53d}.burst .spark{animation:twinkle .18s infinite alternate}@keyframes bob{50%{translate:0 -12px;rotate:10deg}}@keyframes twinkle{to{opacity:.25;scale:.6}}@keyframes upgrade{0%{scale:.82;filter:brightness(1)}45%{scale:1.13;filter:brightness(2)}100%{scale:1;filter:brightness(1)}}
</style></head><body><main class="wrap"><h1>厨师布 · 立体卡牌实验</h1><p class="hint">在卡牌上拖动手指，观察立体视差与光泽</p><div class="scene" id="scene"><div class="card" id="card"><div class="plate"></div><div class="inner"><div class="window"></div><div class="shelf"></div><div class="counter"></div><div class="ambient"></div></div><svg class="chef" viewBox="0 0 300 350" aria-label="厨师布卡通角色"><defs><radialGradient id="fur"><stop stop-color="#f9c49b"/><stop offset="1" stop-color="#c8875e"/></radialGradient><linearGradient id="hat" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e4d9cf"/></linearGradient></defs><ellipse cx="155" cy="310" rx="100" ry="15" fill="#4d2a1b" opacity=".3"/><ellipse cx="108" cy="285" rx="30" ry="23" fill="#a56c4b"/><ellipse cx="201" cy="285" rx="30" ry="23" fill="#a56c4b"/><ellipse cx="151" cy="231" rx="94" ry="78" fill="#f8f2eb" stroke="#d9c5b7" stroke-width="4"/><path d="M90 192Q65 200 49 230L26 201" fill="none" stroke="#f4ece5" stroke-width="32" stroke-linecap="round"/><path d="M210 192Q237 208 253 225" fill="none" stroke="#f4ece5" stroke-width="31" stroke-linecap="round"/><circle cx="80" cy="105" r="31" fill="#a36a4b"/><circle cx="220" cy="105" r="31" fill="#a36a4b"/><circle cx="80" cy="105" r="18" fill="#6f4838"/><circle cx="220" cy="105" r="18" fill="#6f4838"/><circle cx="150" cy="150" r="111" fill="url(#fur)" stroke="#a46b4b" stroke-width="3"/><ellipse cx="102" cy="171" rx="19" ry="15" fill="#ffcc6c"/><ellipse cx="202" cy="171" rx="19" ry="15" fill="#ffcc6c"/><circle cx="119" cy="147" r="8" fill="#382016"/><circle cx="183" cy="147" r="8" fill="#382016"/><path d="M139 164q11 15 22 0" fill="none" stroke="#442419" stroke-width="4" stroke-linecap="round"/><path d="M139 164q11 35 22 0" fill="#ed7977" stroke="#442419" stroke-width="3"/><path d="M90 75Q68 43 94 30Q110 14 133 31Q154 0 179 27Q206 10 219 38Q236 57 210 78Z" fill="url(#hat)" stroke="#a68d7c" stroke-width="4"/><rect x="94" y="70" width="118" height="18" rx="9" fill="#fff" stroke="#a68d7c" stroke-width="3"/><path d="M121 209l30 15 30-15" fill="none" stroke="#ce4436" stroke-width="10"/><path d="M149 223l-13 27 19-9 18 9-12-27" fill="#e54b3a" stroke="#9e3025" stroke-width="2"/><circle cx="125" cy="256" r="5" fill="#49342b"/><circle cx="125" cy="275" r="5" fill="#49342b"/><rect x="123" y="277" width="59" height="30" rx="9" fill="#fff" stroke="#c9b8a7" stroke-width="3"/><text x="152" y="298" text-anchor="middle" font-size="18">🐻</text><g transform="rotate(-22 45 185)"><rect x="33" y="174" width="19" height="64" rx="6" fill="#e75a43" stroke="#733a27" stroke-width="3"/><rect x="25" y="118" width="36" height="63" rx="8" fill="#c6c6c6" stroke="#584c47" stroke-width="4"/><path d="M34 129v37m10-37v37m10-37v37" stroke="#675d56" stroke-width="4"/></g><g transform="rotate(-15 250 230)"><ellipse cx="251" cy="224" rx="44" ry="18" fill="#37363c" stroke="#9d9da3" stroke-width="5"/><path d="M209 224q42 29 84 0" fill="#4b4242"/><path d="M289 222l23-12" stroke="#393435" stroke-width="10" stroke-linecap="round"/></g></svg><div class="food">🍤<br>🥦</div><span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span><div class="banner">厨师布</div><div class="stars">★ ★ ★</div><div class="crest">👨‍🍳</div><div class="shine"></div><div class="glow"></div></div></div><div class="controls"><button id="l1">基础卡</button><button id="l2">立体卡</button><button id="l5" class="active">镀闪卡</button><button id="play">✨ 升级动画</button></div><p class="info">这是可操作的 2.5D 分层卡牌原型：手指拖动会改变角度、角色深度和反光。没有依赖外部 3D CDN。</p></main><script>
const scene=document.getElementById('scene'),card=document.getElementById('card');let down=false,rx=0,ry=0,tx=0,ty=0;function point(e){const r=scene.getBoundingClientRect();tx=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));ty=Math.max(-1,Math.min(1,(e.clientY-r.top)/r.height*2-1));}scene.addEventListener('pointerdown',e=>{down=true;scene.setPointerCapture(e.pointerId);point(e)});scene.addEventListener('pointermove',e=>{if(down)point(e)});scene.addEventListener('pointerup',()=>{down=false;tx=ty=0});scene.addEventListener('pointercancel',()=>{down=false;tx=ty=0});function tick(){rx+=( -ty*17-rx)*.12;ry+=(tx*20-ry)*.12;card.style.setProperty('--rx',rx+'deg');card.style.setProperty('--ry',ry+'deg');card.style.setProperty('--px',ry*.48+'px');card.style.setProperty('--py',rx*-.35+'px');card.style.setProperty('--shine',(ry*3)+'%');requestAnimationFrame(tick)}tick();for(const [id,cls] of [['l1','low'],['l2','mid'],['l5','']])document.getElementById(id).onclick=()=>{card.className='card '+cls;document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active')};document.getElementById('play').onclick=()=>{scene.classList.remove('burst');void scene.offsetWidth;scene.classList.add('burst');setTimeout(()=>scene.classList.remove('burst'),1400)};
</script></body></html>
