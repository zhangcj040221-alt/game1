(()=>{'use strict';const stage=document.getElementById('stage'),card=document.getElementById('card'),canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let down=false,tx=0,ty=0,rx=0,ry=0,level=5,burst=0,last=performance.now();const names=['','基础','立体','动态','特效','镀闪'];const dots=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.5,v:Math.random()*.10+.04,t:Math.random()*6.28}));function pos(e){const r=stage.getBoundingClientRect();tx=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));ty=Math.max(-1,Math.min(1,(e.clientY-r.top)/r.height*2-1));}stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId);pos(e)});stage.addEventListener('pointermove',e=>{if(down)pos(e)});function release(){down=false;tx=ty=0}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);document.getElementById('reset').addEventListener('click',release);function setLevel(n){level=n;card.dataset.level=n;document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.level)===n));status.textContent='当前：Lv.'+n+' '+names[n]+'卡'}document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>setLevel(Number(b.dataset.level))));document.getElementById('upgrade').addEventListener('click',()=>{setLevel(5);card.classList.remove('impact');void card.offsetWidth;card.classList.add('impact');burst=1.5;setTimeout(()=>card.classList.remove('impact'),1300)});function resize(){const b=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(b.width*d));canvas.height=Math.max(1,Math.round(b.height*d));ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;rx+=(tx*20-rx)*Math.min(1,dt*10);ry+=(-ty*15-ry)*Math.min(1,dt*10);card.style.setProperty('--ry',rx.toFixed(2)+'deg');card.style.setProperty('--rx',ry.toFixed(2)+'deg');card.style.setProperty('--mx',(rx/20).toFixed(3));card.style.setProperty('--my',(ry/15).toFixed(3));card.style.setProperty('--shine',((rx/20+1)*50).toFixed(1)+'%');const d=Math.min(window.devicePixelRatio||1,2),w=canvas.width/d,h=canvas.height/d;ctx.clearRect(0,0,w,h);if(level>=4){for(const p of dots){p.y-=dt*p.v*(burst>0?4:1);if(p.y<0)p.y=1;ctx.globalAlpha=(.28+.5*Math.sin(t*.002+p.t))*(level===4?.55:1);ctx.fillStyle='#ffe6a4';ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r*(burst>0?2.4:1),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}burst=Math.max(0,burst-dt);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
