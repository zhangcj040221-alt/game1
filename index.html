(()=>{'use strict';const stage=document.getElementById('stage'),card=document.getElementById('card'),canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let down=false,tx=0,ty=0,rx=0,ry=0,level=5,burst=0,last=performance.now();const dots=Array.from({length:34},(_,i)=>({x:Math.random(),y:Math.random(),r:1+Math.random()*2.2,s:.06+Math.random()*.12,p:Math.random()*6.28}));function pos(e){const b=stage.getBoundingClientRect();tx=Math.max(-1,Math.min(1,((e.clientX-b.left)/b.width-.5)*2));ty=Math.max(-1,Math.min(1,((e.clientY-b.top)/b.height-.5)*2));}stage.addEventListener('pointerdown',e=>{down=true;stage.setPointerCapture(e.pointerId);pos(e)});stage.addEventListener('pointermove',e=>{if(down)pos(e)});function release(){down=false;tx=0;ty=0}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);document.getElementById('reset').onclick=release;function setLevel(n){level=n;card.dataset.level=n;document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',Number(b.dataset.n)===n));document.getElementById('status').textContent=['','基础静态卡面','立体视差：拖动查看前后层','动态卡：增加流光','特效卡：增加粒子','镀闪卡：完整光泽与特效'][n];}document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>setLevel(Number(b.dataset.n))));document.getElementById('upgrade').onclick=()=>{setLevel(5);card.classList.remove('impact');void card.offsetWidth;card.classList.add('impact');burst=1.3;setTimeout(()=>card.classList.remove('impact'),1250)};function resize(){const b=canvas.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(b.width*d));canvas.height=Math.max(1,Math.floor(b.height*d));ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;rx+=(tx*23-rx)*Math.min(1,dt*10);ry+=(-ty*17-ry)*Math.min(1,dt*10);card.style.setProperty('--ry',rx.toFixed(2)+'deg');card.style.setProperty('--rx',ry.toFixed(2)+'deg');card.style.setProperty('--mx',(rx/23).toFixed(3));card.style.setProperty('--my',(ry/17).toFixed(3));card.style.setProperty('--light',((rx/23+1)*50).toFixed(1)+'%');const d=Math.min(devicePixelRatio||1,2),w=canvas.width/d,h=canvas.height/d;ctx.clearRect(0,0,w,h);if(level>=3){for(const p of dots){p.y-=dt*p.s*(burst>0?3:1);if(p.y<-.05)p.y=1.05;const a=(.35+.5*Math.sin(now*.0015+p.p))*(level===3?.3:1);ctx.globalAlpha=Math.max(.04,a);ctx.fillStyle=level===5?'#ffe8a0':'#f5ba71';ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r*(burst>0?2:1),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}burst=Math.max(0,burst-dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);})();
