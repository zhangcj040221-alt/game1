<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17121c">
<title>厨师布 · 立体典藏卡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#50352a,#17121c 68%);color:#fbe7c5;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;min-height:100dvh}
main{height:100dvh;min-height:480px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1100px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
header{text-align:center}header small{letter-spacing:.3em;color:#cfa775;font-size:10px}h1{font-size:22px;margin:8px 0}header p{font-size:12px;color:#ccb39a;margin:0}
#stage{position:relative;min-height:0;touch-action:pan-y;cursor:grab}#stage:active{cursor:grabbing}canvas{display:block;width:100%;height:100%}
#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 35px #0008);pointer-events:none}
footer{text-align:center;z-index:1}#status{font-size:12px;color:#ccb39a;min-height:32px;margin:8px 0;line-height:1.6}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
button,.link{font:inherit;font-size:13px;border:1px solid #957044;border-radius:12px;padding:11px 16px;color:#fbe7c5;background:#2f242b;cursor:pointer}button:disabled{opacity:.4;cursor:default}button[aria-pressed="true"],#upgrade{background:linear-gradient(135deg,#e4b76e,#9a622c);color:#281b15}button:focus-visible,a:focus-visible{outline:2px solid #ffe5a0;outline-offset:4px}
.link{display:inline-block;margin-top:12px;background:none;border:0;font-size:11px;color:#cfa775;padding:4px}#flash{position:absolute;inset:0;pointer-events:none;border-radius:30%;opacity:0;background:radial-gradient(ellipse,#ffe7ab55,transparent 65%)}.burst #flash{animation:flash 1.4s ease-out}@keyframes flash{15%{opacity:1}100%{opacity:0}}[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.burst #flash{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<main>
<header><small>CHEF BU · COLLECTIBLE</small><h1>厨师布 · 立体典藏卡</h1><p>一间温暖的小厨房，一位认真做饭的厨师</p></header>
<section id="stage" aria-label="厨师布三维卡牌，左右拖动查看层次">
<img id="poster" src="./assets/chef_bu_preview.png" alt="厨师布现有模型的离线渲染预览"><div id="flash"></div>
</section>
<footer>
<p id="status" role="status" aria-live="polite">正在加载立体卡，先展示已有模型预览……</p>
<div class="controls"><button id="front" disabled>回正</button><button id="motion" disabled aria-pressed="false">轻动态：关</button><button id="upgrade" disabled>✦ 金光演出</button><button id="retry" hidden>重新加载</button></div>
<a class="link" href="./assets/chef_bu_preview.png" target="_blank" rel="noopener">打开静态预览 ↗</a>
</footer>
</main>
<script type="module" src="./viewer.js"></script>
</body></html>
